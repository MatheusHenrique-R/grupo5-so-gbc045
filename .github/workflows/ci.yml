# CI: compila e testa em Linux e Windows a cada push e Pull Request.
# ATENÇÃO: os runners do GitHub são máquinas virtuais compartilhadas.
# Servem para verificar CORREÇÃO, nunca para coletar os dados oficiais de desempenho.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  regras:
    name: Regras do enunciado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrutura obrigatória do repositório
        run: |
          for d in video code testes dados experimentos; do
            test -d "$d" || { echo "::error::pasta $d/ ausente"; exit 1; }
          done
          test -f README.md || { echo "::error::README.md ausente"; exit 1; }
          echo "OK: estrutura completa"

      - name: Proibido winpthreads no código Windows
        run: |
          # Verifica todo arquivo de code/ com "win" no nome (ex.: platform_thread_win32.c)
          arquivos=$(find code -type f -iname '*win*.[ch]' 2>/dev/null)
          if [ -z "$arquivos" ]; then
            echo "Nenhum arquivo Windows em code/ ainda — verificação pulada"; exit 0
          fi
          if grep -nE '^\s*#\s*include\s*[<"](pthread|semaphore)\.h' $arquivos; then
            echo "::error::código Windows inclui pthread.h/semaphore.h (winpthreads é proibido)"
            exit 1
          fi
          echo "OK: nenhum include de pthreads no código Windows"

  build:
    name: Build e testes (${{ matrix.os }})
    needs: regras
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sem CMakeLists.txt ainda
        if: hashFiles('CMakeLists.txt') == ''
        run: echo "Nenhum CMakeLists.txt na raiz — build pulado"

      - name: Configurar
        if: hashFiles('CMakeLists.txt') != ''
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        if: hashFiles('CMakeLists.txt') != ''
        run: cmake --build build --config Release

      - name: Testes
        if: hashFiles('CMakeLists.txt') != ''
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=ignore
